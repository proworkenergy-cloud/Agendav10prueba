<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda Climatización V10</title><style>body{font-family:system-ui;background:#f1f5f9;color:#172033;margin:0}header{background:#12345a;color:white;padding:18px}main{max-width:800px;margin:auto;padding:16px}button,input,select,textarea{font:inherit;padding:10px;border-radius:9px;border:1px solid #bac7d4;margin:4px 0}button{background:#1766b1;color:white;cursor:pointer;border:0}button.secondary{background:#506477}.card{background:white;padding:15px;margin:12px 0;border-radius:12px;box-shadow:0 1px 5px #ccd5df}.tabs{display:flex;flex-wrap:wrap;gap:6px}.tabs button{flex:1;min-width:130px}input,textarea,select{box-sizing:border-box;width:100%}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.muted{color:#596575;font-size:.9em}.hidden{display:none}img{max-width:110px;max-height:100px;margin:5px;border-radius:8px}h2{margin-top:6px}.alert{color:#bb3c16;font-weight:bold}.done{background:#d5f4df!important}.stopped{background:#ffd8d8!important}.ongoing{background:#ffe2b2!important}.monthgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.monthgrid button{padding:8px 1px;min-width:0;background:#e6edf6;color:#15273a}.monthgrid .active{outline:3px solid #1766b1}.monthhead{display:flex;justify-content:space-between;align-items:center}.danger{background:#aa2424!important}.weekday{text-align:center;font-size:12px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions button{flex:0 1 auto}.activity{background:#f1f6fc;padding:10px;border-radius:9px;margin:8px 0}.photos{display:flex;flex-wrap:wrap;gap:6px}.photos img{max-width:130px;max-height:120px;object-fit:cover}
#login{max-width:440px;margin:35px auto}.busy{opacity:.65;pointer-events:none}.msg{white-space:pre-wrap;color:#b42318}.ok{color:#17603a}.photos img{cursor:pointer}.mini{font-size:.86rem}.inlinecheck{width:auto;display:inline-block}.tabs button{min-width:105px}button:disabled{opacity:.5;cursor:not-allowed}</style>
<header><strong>🔧 Agenda Climatización · V10</strong><div class="muted" style="color:#dbeafe">Agenda compartida · Supabase</div></header><main>
<div id="login" class="card"><h2>Acceder</h2><input id="email" type="email" autocomplete="username" placeholder="Correo electrónico"><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña"><button id="loginbtn" onclick="login()">Entrar</button><p class="muted">Usa la cuenta que te ha facilitado el administrador.</p></div>
<div id="app" hidden><div class="card"><div class="row"><div><strong id="who"></strong><p class="muted" id="rol"></p></div><div><button class="secondary" onclick="logout()">Cerrar sesión</button></div></div></div><div id="tabs" class="tabs"></div><div id="view"></div></div>
<p id="msg" role="status" class="msg"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
'use strict';
const sb=window.supabase?.createClient('https://urdapekfootkielaqnub.supabase.co','sb_publishable_WR_SK3PvIwewLXhlwh2sxg_VelD0PgP');
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDate=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let user=null,profile=null,team=[],jobs=[],works=[],days=[],assignments=[],recurring=[],notes=[],photos=[],alerts=[],tab='Calendario',selectedDay=localDate(),shownMonth=localDate().slice(0,7),openDetails=new Set();
const admin=()=>profile?.role==='admin',office=()=>profile?.role==='oficina',tech=()=>profile?.role==='technician';
const say=(s,ok=false)=>{$('msg').textContent=s||'';$('msg').className=ok?'ok':'msg'};
function err(e){say(e?.message||String(e))}function required(v,msg){if(!String(v||'').trim())throw Error(msg);return String(v).trim()}
async function login(){if(!sb)return say('No se ha podido cargar la conexión. Comprueba Internet.');$('loginbtn').disabled=true;try{let {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await start()}catch(e){err(e)}finally{$('loginbtn').disabled=false}}
async function logout(){await sb.auth.signOut();user=null;profile=null;$('app').hidden=true;$('login').hidden=false;say('Sesión cerrada',true)}
async function query(name,columns='*'){let {data,error}=await sb.from(name).select(columns);if(error)throw Error(name+': '+error.message);return data||[]}
async function start(){let {data:{user:u},error}=await sb.auth.getUser();if(error||!u)return;user=u;let {data:p,error:pe}=await sb.from('profiles').select('id,display_name,role').eq('id',u.id).single();if(pe||!p)throw Error('No se pudo cargar el perfil: '+(pe?.message||''));profile=p;$('login').hidden=true;$('app').hidden=false;$('who').textContent=p.display_name;$('rol').textContent=p.role==='admin'?'Administrador':p.role==='oficina'?'Oficina · solo consulta':'Técnico';tab=tech()?'Mis trabajos':'Calendario';await refresh()}
async function refresh(){try{say('Cargando información…');let result=await Promise.all([query('profiles','id,display_name,role'),query('jobs'),query('works'),query('work_days'),query('work_day_technicians'),query('recurring'),query('notes'),query('photos'),query('alerts')]);[team,jobs,works,days,assignments,recurring,notes,photos,alerts]=result;render();say('Datos actualizados',true)}catch(e){err(e)}}
const nameOf=id=>team.find(t=>t.id===id)?.display_name||'Técnico';const jobAssigned=j=>j.technician_id===user?.id;const dayAssigned=d=>assignments.some(a=>a.work_day_id===d.id&&a.technician_id===user?.id);
const assignedNames=d=>assignments.filter(a=>a.work_day_id===d.id).map(a=>nameOf(a.technician_id)).join(', ')||'Sin asignar';
const cls=s=>({'terminado':'done','continúa':'ongoing','continua':'ongoing','suspendido':'stopped'}[String(s||'').toLowerCase()]||'');
const status=s=>({'continua':'Continúa','terminado':'Terminado','suspendido':'Suspendido','pendiente':'Pendiente'}[String(s||'').toLowerCase()]||s||'Pendiente');
const technicianOptions=(selected)=>team.filter(t=>t.role==='technician').map(t=>`<option value="${esc(t.id)}" ${t.id===selected?'selected':''}>${esc(t.display_name)}</option>`).join('');
function maintenanceState(r,month){let items=jobs.filter(j=>j.recurring_id===r.id&&String(j.job_date||'').startsWith(month));if(!items.length)return 'pendiente';if(items.every(j=>String(j.state||'').toLowerCase()==='terminado'))return 'terminado';if(items.some(j=>['continua','continúa'].includes(String(j.state||'').toLowerCase())))return 'continua';return 'pendiente'}
function ongoingItems(){return [...jobs.filter(j=>['continua','continúa'].includes(String(j.state||'').toLowerCase())).map(j=>({kind:'job',id:j.id,name:j.name,client:j.client,date:j.job_date,tech:nameOf(j.technician_id)})),...days.filter(d=>['continua','continúa'].includes(String(d.state||'').toLowerCase())).map(d=>({kind:'work',id:d.id,name:works.find(w=>w.id===d.work_id)?.name||'Obra',client:works.find(w=>w.id===d.work_id)?.client||'',date:d.work_date,tech:assignedNames(d)}))]}
const closurePrefix='[CIERRE_OBRA_V10] ';
function closeDate(w){let markers=notes.filter(n=>n.work_id===w.id&&String(n.body||'').startsWith(closurePrefix));let latest=markers.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')))[0];return latest?String(latest.body).slice(closurePrefix.length,closurePrefix.length+10):(w.closed?String(w.closed_at||w.updated_at||'').slice(0,10):'')}
function archiveWork(w){return !!w.closed}
function photoDay(p){let match=String(p.storage_path||'').match(/\/dias\/(\d{4}-\d{2}-\d{2})\//);return match?match[1]:String(p.created_at||'').slice(0,10)}
function workDayPhotos(workId,date){return photos.filter(p=>p.work_id===workId&&photoDay(p)===date)}
function nav(t){tab=t;render()}function chooseDay(d){selectedDay=d;shownMonth=d.slice(0,7);render()}function shiftMonth(n){let [y,m]=shownMonth.split('-').map(Number),d=new Date(y,m-1+n,1);shownMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
function monthHtml(){let [y,m]=shownMonth.split('-').map(Number),first=new Date(y,m-1,1),len=new Date(y,m,0).getDate(),offset=(first.getDay()+6)%7,cells=Array(offset).fill('<span></span>');for(let i=1;i<=len;i++){let d=shownMonth+'-'+String(i).padStart(2,'0'),count=jobs.filter(j=>j.job_date===d).length+days.filter(x=>x.work_date===d).length;cells.push(`<button class="${d===selectedDay?'active':''}" onclick="chooseDay('${d}')">${i}${count?' •':''}</button>`)}return `<div class="card"><div class="monthhead"><button onclick="shiftMonth(-1)">◀</button><b>${first.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</b><button onclick="shiftMonth(1)">▶</button></div><div class="monthgrid">${['L','M','X','J','V','S','D'].map(x=>`<span class="weekday">${x}</span>`).join('')}${cells.join('')}</div><p class="muted">Pulsa cualquier día. • indica trabajos registrados.</p></div>`}
function toggle(id){openDetails.has(id)?openDetails.delete(id):openDetails.add(id);render()}
function cardDetails(kind,id){let key=kind+id;let ns=notes.filter(n=>n[kind==='job'?'job_id':'work_id']===id&&!String(n.body||'').startsWith(closurePrefix)),ps=photos.filter(p=>p[kind==='job'?'job_id':'work_id']===id),as=alerts.filter(a=>a[kind==='job'?'job_id':'work_id']===id);return `<div class="actions"><button class="secondary" onclick="toggle('${key}')">${openDetails.has(key)?'Ocultar':'Ver'} comentarios y fotos</button></div>${openDetails.has(key)?`<div class="activity"><h3>Comentarios</h3>${ns.map(n=>`<p><b>${esc(nameOf(n.author_id))}:</b> ${esc(n.body)} <small>${esc((n.created_at||'').slice(0,10))}</small></p>`).join('')||'<p class="muted">Sin comentarios.</p>'}<h3>Avisos</h3>${as.map(a=>`<p>⚠️ ${esc(a.kind)}: ${esc(a.body)}</p>`).join('')||'<p class="muted">Sin avisos.</p>'}<h3>Fotografías (${ps.length}${kind==='job'?'/5':' en total'})</h3><div class="photos" id="gallery-${kind}-${id}">${ps.length?'<p class="muted">Cargando imágenes…</p>':'<p class="muted">Sin fotografías.</p>'}</div></div>`:''}`}
function jobCard(j){let editable=admin(),canWrite=tech()&&jobAssigned(j);return `<div class="card ${cls(j.state)}"><b>${esc(j.name)}</b><p>${esc(j.client||'')} · ${esc(j.address||'')}</p><p>${esc(nameOf(j.technician_id))} · ${esc(status(j.state))}</p>${editable?`<label>Fecha</label><input type="date" id="date-${j.id}" value="${esc(j.job_date||'')}"><label>Técnico</label><select id="tech-${j.id}">${technicianOptions(j.technician_id)}</select><div class="actions"><button onclick="updateJob('${j.id}')">Guardar cambios</button><button class="danger" onclick="remove('jobs','${j.id}')">Eliminar trabajo</button></div>`:''}${cardDetails('job',j.id)}${canWrite?`<textarea id="note-job-${j.id}" placeholder="Comentario o motivo de suspensión"></textarea><div class="actions"><button onclick="setJobState('${j.id}','terminado')">Terminado</button><button onclick="setJobState('${j.id}','continua')">Continúa</button><button onclick="setJobState('${j.id}','suspendido')">Suspendido</button></div>${techExtras('job',j.id)}`:''}</div>`}
function dayCard(d){let w=works.find(x=>x.id===d.work_id);if(!w)return '';let canWrite=tech()&&dayAssigned(d);return `<div class="card ${cls(d.state)}"><b>🏗️ ${esc(w.name)}</b><p>${esc(w.client||'')} · ${esc(w.address||'')}</p><p>${esc(d.work_date)} · ${esc(assignedNames(d))} · ${esc(status(d.state))} ${d.incident?'⚠️':''}</p>${cardDetails('work',w.id)}${canWrite?`<textarea id="note-work-${w.id}" placeholder="Comentario, incidencia o materiales"></textarea><div class="actions"><button onclick="setWorkState('${d.id}','terminado')">Terminado</button><button onclick="setWorkState('${d.id}','continua')">Continúa</button><button onclick="setWorkState('${d.id}','suspendido')">Suspendido</button></div>${techExtras('work',w.id,d.work_date)}`:''}</div>`}
function techExtras(kind,id,date=''){let count=kind==='job'?photos.filter(p=>p.job_id===id).length:workDayPhotos(id,date).length;return `<div class="actions"><button class="secondary" onclick="sendAlert('${kind}','${id}','Incidencia')">⚠️ Incidencia</button><button class="secondary" onclick="sendAlert('${kind}','${id}','Materiales')">📦 Materiales</button></div><label>Añadir fotografías (${count}/5${kind==='work'?' de esta jornada':''})</label><input type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="upload('${kind}','${id}',this,'${date}')">`}

let showWorkHistory=false;let showAllClosedWorks=false;
function render(){if(!profile)return;let tabs=tech()?['Mis trabajos','Mis obras']:office()?['Calendario','Obras','Mantenimiento','Avisos pendientes']:['Calendario','Nuevo trabajo','Mantenimiento','Obras','Avisos pendientes'];if(!tabs.includes(tab))tab=tabs[0];$('tabs').innerHTML=tabs.map(t=>`<button class="${t===tab?'':'secondary'}" onclick="nav('${t}')">${t==='Avisos pendientes'?t+' ('+(ongoingItems().length+alerts.filter(a=>!a.resolved).length)+')':t}</button>`).join('');let out='';
if(tab==='Calendario'||tab==='Mis trabajos'){out=monthHtml()+`<h2>Trabajo por día · ${esc(selectedDay)}</h2>`+jobs.filter(j=>j.job_date===selectedDay).map(jobCard).join('')+days.filter(d=>d.work_date===selectedDay).map(dayCard).join('');if(!jobs.some(j=>j.job_date===selectedDay)&&!days.some(d=>d.work_date===selectedDay))out+='<div class="card">Sin trabajos este día.</div>'}
if(tab==='Nuevo trabajo'&&admin())out=`<div class="card"><h2>Nuevo trabajo</h2><input id="jn" placeholder="Descripción del trabajo"><input id="jc" placeholder="Cliente"><input id="ja" placeholder="Dirección"><input id="jd" type="date" value="${selectedDay}"><select id="jt">${technicianOptions()}</select><button onclick="newJob()">Guardar trabajo</button></div>`;
if(tab==='Mantenimiento'){
let month=shownMonth,doneCount=recurring.filter(r=>maintenanceState(r,month)==='terminado').length;
out=`<div class="card"><h2>Mantenimientos · ${esc(month)}</h2><p><strong>${doneCount} terminados de ${recurring.length}</strong> · ${recurring.length-doneCount} por terminar</p><label>Consultar mes</label><input type="month" value="${esc(month)}" onchange="shownMonth=this.value;render()"><p class="muted">Al cambiar de mes, cada mantenimiento muestra el estado de ese mes. El historial anterior se conserva.</p></div>`;
if(admin())out+=`<div class="card"><h2>Nuevo mantenimiento</h2><input id="rn" placeholder="Nombre del mantenimiento"><input id="rc" placeholder="Cliente"><button onclick="newRecurring()">Guardar mantenimiento</button></div>`;
out+=recurring.map(r=>{let st=maintenanceState(r,month),related=jobs.filter(j=>j.recurring_id===r.id&&String(j.job_date||'').startsWith(month));return `<div class="card ${cls(st)}"><b>${esc(r.name)}</b> · ${esc(r.client||'')}<p><strong>${st==='pendiente'?'Pendiente':esc(status(st))}</strong>${related.length?' · '+related.length+' asignación(es)':''}</p>${related.length?`<div class="activity"><strong>Visitas de ${esc(month)}</strong>${related.slice().sort((a,b)=>String(b.job_date||'').localeCompare(String(a.job_date||''))).map(j=>`<div class="card"><p><b>${esc(j.job_date||'Sin fecha')}</b> · ${esc(nameOf(j.technician_id))} · ${esc(status(j.state))}</p>${cardDetails('job',j.id)}</div>`).join('')}</div>`:'<p class="muted">No hay visitas registradas este mes.</p>'}${admin()?`<label>Asignar día</label><input type="date" id="rd-${r.id}" value="${month===localDate().slice(0,7)?selectedDay:month+'-01'}"><select id="rt-${r.id}">${technicianOptions()}</select><div class="actions"><button onclick="assignRecurring('${r.id}')">Asignar día</button><button class="danger" onclick="remove('recurring','${r.id}')">Eliminar mantenimiento</button></div>`:''}</div>`}).join('')||'<div class="card">Sin mantenimientos.</div>';
}

if(tab==='Obras'||tab==='Mis obras'){let archived=works.filter(archiveWork),visible=works.filter(w=>!archiveWork(w));out=admin()?`<div class="card"><h2>Nueva obra</h2><input id="wn" placeholder="Nombre de la obra"><input id="wc" placeholder="Cliente"><input id="wa" placeholder="Dirección"><button onclick="newWork()">Crear obra</button></div>`:'';out+=visible.map(w=>workPanel(w)).join('')||'<div class="card">Sin obras activas.</div>';if(!tech())out+=`<div class="card"><button class="secondary" onclick="showWorkHistory=!showWorkHistory;render()">${showWorkHistory?'Ocultar historial':'Historial de obras finalizadas'} (${archived.length})</button></div>`;if(!tech()&&showWorkHistory){out+=`<div class="card"><h2>Historial de obras finalizadas</h2><label>Consultar mes de finalización</label><input type="month" value="${esc(shownMonth)}" onchange="shownMonth=this.value;render()"><label><input class="inlinecheck" type="checkbox" ${showAllClosedWorks?'checked':''} onchange="showAllClosedWorks=this.checked;render()"> Todas las obras finalizadas</label></div>`;let monthly=showAllClosedWorks?archived:archived.filter(w=>closeDate(w).startsWith(shownMonth));out+=monthly.map(w=>workPanel(w,true)).join('')||'<div class="card">No hay obras finalizadas en este mes.</div>';}}

function journalPhotoDate(p){const m=String(p.storage_path||'').match(/\/dias\/(\d{4}-\d{2}-\d{2})\//);return m?m[1]:null}
function workJournal(w){
 const ds=days.filter(d=>d.work_id===w.id).sort((a,b)=>String(b.work_date).localeCompare(String(a.work_date)));
 const ns=notes.filter(n=>n.work_id===w.id&&!String(n.body||'').startsWith(closurePrefix));
 const ps=photos.filter(p=>p.work_id===w.id);
 let out=ds.map(d=>{
  const key='jday-'+d.id,open=openDetails.has(key),date=d.work_date;
  const pics=ps.filter(p=>journalPhotoDate(p)===date);
  const comments=ns.filter(n=>String(n.created_at||'').slice(0,10)===date);
  return `<div class="activity"><button class="secondary" onclick="toggle('${key}')">${esc(date)} · ${esc(assignedNames(d))} · ${pics.length} foto(s) · ${open?'Ocultar':'Ver'} jornada</button>${open?`<p><b>Comentarios registrados ese día</b></p>${comments.map(n=>`<p><b>${esc(nameOf(n.author_id))}:</b> ${esc(n.body)}</p>`).join('')||'<p class="muted">Sin comentarios.</p>'}<div class="photos" id="jgallery-${key}"></div>`:''}</div>`;
 }).join('');
 const old=ps.filter(p=>!journalPhotoDate(p)||!ds.some(d=>d.work_date===journalPhotoDate(p)));
 const other=ns.filter(n=>!ds.some(d=>d.work_date===String(n.created_at||'').slice(0,10)));
 const key='jold-'+w.id,open=openDetails.has(key);
 if(old.length||other.length)out+=`<div class="activity"><button class="secondary" onclick="toggle('${key}')">Fotografías anteriores o sin jornada identificada (${old.length}) · ${open?'Ocultar':'Ver'}</button>${open?`${other.map(n=>`<p><b>${esc(nameOf(n.author_id))}:</b> ${esc(n.body)} · ${esc(String(n.created_at||'').slice(0,10))}</p>`).join('')}<div class="photos" id="jgallery-${key}"></div>`:''}</div>`;
 return '<h3>Jornadas de obra</h3><p class="muted">Las fotografías nuevas se muestran por día. Las antiguas sin fecha identificable se conservan aparte. Los comentarios se agrupan por su fecha de registro.</p>'+ (out||'<p class="muted">Sin jornadas.</p>');
}
async function loadJournalGalleries(){
 for(const key of openDetails){
  if(!key.startsWith('jday-')&&!key.startsWith('jold-'))continue;
  const el=$('jgallery-'+key);if(!el)continue;
  let ps=[];
  if(key.startsWith('jday-')){const d=days.find(x=>x.id===key.slice(5));if(d)ps=photos.filter(p=>p.work_id===d.work_id&&journalPhotoDate(p)===d.work_date)}
  else{const id=key.slice(5);ps=photos.filter(p=>p.work_id===id&&(!journalPhotoDate(p)||!days.some(d=>d.work_id===id&&d.work_date===journalPhotoDate(p))))}
  el.innerHTML='';for(const p of ps){const {data,error}=await sb.storage.from('fotos-trabajos').createSignedUrl(p.storage_path,300);if(error)continue;const a=document.createElement('a');a.href=data.signedUrl;a.target='_blank';a.rel='noopener noreferrer';const img=document.createElement('img');img.src=data.signedUrl;img.alt='Fotografía de obra';a.append(img);el.append(a)}
 }
}

function workPanel(w,historical=false){return `<div class="card ${w.closed?'done':''}"><h2>${esc(w.name)}</h2><p>📍 ${esc(w.address||'')} · ${esc(w.client||'')}</p><p>${w.closed?'🟢 Obra finalizada'+(closeDate(w)?' · '+esc(closeDate(w)):''):'Obra activa'}${historical?' · Historial · Fecha de cierre registrada: '+esc(closeDate(w)||'Sin fecha'):''}</p>${workJournal(w)}<h3>Días registrados</h3>${days.filter(d=>d.work_id===w.id).map(d=>`<p>${esc(d.work_date)} · ${esc(assignedNames(d))} · ${esc(status(d.state))} · ${workDayPhotos(w.id,d.work_date).length} foto(s)${admin()&&!historical?` <button class="danger mini" onclick="removeWorkDay('${d.id}')">Eliminar día</button>`:''}</p>`).join('')||'<p class="muted">Sin días asignados.</p>'}${admin()&&!w.closed&&!historical?`<label>Asignar día</label><input type="date" id="wd-${w.id}" value="${selectedDay}"><div>${team.filter(t=>t.role==='technician').map(t=>`<label><input class="inlinecheck" type="checkbox" id="check-${w.id}-${t.id}"> ${esc(t.display_name)}</label>`).join(' ')}</div><div class="actions"><button onclick="assignWork('${w.id}')">Asignar técnicos</button><button class="secondary" onclick="closeWork('${w.id}')">Finalizar obra</button><button class="danger" onclick="remove('works','${w.id}')">Eliminar obra</button></div>`:''}</div>`}

if(tab==='Avisos pendientes'){let ongoing=ongoingItems(),unresolved=alerts.filter(a=>!a.resolved);out=`<h2>Avisos pendientes (${ongoing.length+unresolved.length})</h2><p class="muted">${ongoing.length} trabajos en «Continúa» · ${unresolved.length} avisos sin resolver.</p>`+ongoing.map(x=>`<div class="card ongoing"><b>${x.kind==='work'?'🏗️ Obra: ':''}${esc(x.name)}</b><p>${esc(x.client)} · ${esc(x.date||'Sin fecha')} · ${esc(x.tech)}</p><p>🟠 Continúa</p></div>`).join('')+unresolved.slice().reverse().map(a=>`<div class="card"><b>${esc(a.kind)} · ${esc(nameOf(a.author_id))}</b><p>${esc(a.body)}</p><p>⚠️ Pendiente</p>${admin()?`<button onclick="resolveAlert('${a.id}')">Marcar resuelto</button>`:''}</div>`).join('');if(!ongoing.length&&!unresolved.length)out+='<div class="card">Sin avisos pendientes.</div>'} 
$('view').innerHTML=out;for(let k of openDetails){let m=k.match(/^(job|work)(.+)$/);if(m)loadGallery(m[1],m[2])}loadJournalGalleries()}
async function run(action){try{say('Guardando…');await action();await refresh()}catch(e){err(e)}}
async function insert(table,row){let {error}=await sb.from(table).insert(row);if(error)throw error}
async function update(table,id,row){let {error}=await sb.from(table).update(row).eq('id',id);if(error)throw error}
async function newJob(){if(!admin())return;await run(async()=>insert('jobs',{name:required($('jn').value,'Indica el trabajo'),client:$('jc').value,address:$('ja').value,job_date:$('jd').value,technician_id:$('jt').value,state:'Pendiente'}));tab='Calendario'}
async function updateJob(id){if(!admin())return;await run(async()=>update('jobs',id,{job_date:$('date-'+id).value,technician_id:$('tech-'+id).value}))}
async function newRecurring(){if(!admin())return;await run(async()=>insert('recurring',{name:required($('rn').value,'Indica el mantenimiento'),client:$('rc').value}))}
async function assignRecurring(id){if(!admin())return;let r=recurring.find(x=>x.id===id);if(!$('rd-'+id).value)return say('Selecciona una fecha');await run(async()=>insert('jobs',{name:r.name,client:r.client,job_date:$('rd-'+id).value,technician_id:$('rt-'+id).value,recurring_id:id,state:'Pendiente'}));tab='Calendario'}
async function newWork(){if(!admin())return;await run(async()=>insert('works',{name:required($('wn').value,'Indica el nombre'),client:$('wc').value,address:required($('wa').value,'Indica la dirección'),closed:false}))}
async function assignWork(id){if(!admin())return;let selected=team.filter(t=>t.role==='technician'&&$('check-'+id+'-'+t.id)?.checked).map(t=>t.id);if(!selected.length)return say('Selecciona al menos un técnico');await run(async()=>{let date=$('wd-'+id).value;let day=days.find(d=>d.work_id===id&&d.work_date===date);if(!day){let {data,error}=await sb.from('work_days').insert({work_id:id,work_date:date,state:'pendiente'}).select('id').single();if(error)throw error;day=data}let existing=assignments.filter(a=>a.work_day_id===day.id).map(a=>a.technician_id);for(let t of selected.filter(t=>!existing.includes(t)))await insert('work_day_technicians',{work_day_id:day.id,technician_id:t})})}
async function closeWork(id){if(!admin()||!confirm('¿Finalizar esta obra?'))return;await run(async()=>{await insert('notes',{work_id:id,author_id:user.id,body:closurePrefix+localDate()});await update('works',id,{closed:true})})}
async function removeWorkDay(id){if(!admin())return;let d=days.find(x=>x.id===id);if(!d)return;let w=works.find(x=>x.id===d.work_id);if(!confirm('¿Eliminar el día '+d.work_date+' de la obra '+(w?.name||'')+'? Se quitarán sus asignaciones de técnicos. La obra y los demás días permanecerán. Esta acción no se puede deshacer.'))return;await run(async()=>{let {data,error}=await sb.from('work_days').delete().eq('id',id).select('id');if(error)throw error;if(!data?.length)throw Error('No se pudo eliminar el día. Comprueba los permisos de administrador.')})}
async function remove(table,id){if(!admin()||!confirm('¿Eliminar definitivamente? Esta acción no se puede deshacer.'))return;await run(async()=>{let {error}=await sb.from(table).delete().eq('id',id);if(error)throw error})}
async function setWorkState(id,state){if(!tech())return;let note=$('note-work-'+days.find(d=>d.id===id)?.work_id)?.value.trim()||'';if(state==='suspendido'&&!note)return say('Indica el motivo de suspensión');await run(async()=>{let {error}=await sb.rpc('cambiar_estado_trabajo',{p_work_day_id:id,p_estado:state});if(error)throw error;if(note)await insert('notes',{work_id:days.find(d=>d.id===id).work_id,author_id:user.id,body:note})})}
async function setJobState(id,state){if(!tech()||!jobAssigned(jobs.find(j=>j.id===id)))return;let note=$('note-job-'+id)?.value.trim()||'';if(state==='suspendido'&&!note)return say('Indica el motivo de suspensión');await run(async()=>{let {error}=await sb.rpc('cambiar_estado_tarea',{p_job_id:id,p_estado:state});if(error)throw error;if(note)await insert('notes',{job_id:id,author_id:user.id,body:note})})}
async function sendAlert(kind,id,kindAlert){if(!tech())return;let note=$('note-'+kind+'-'+id)?.value.trim();if(!note)return say('Escribe el detalle del aviso');await run(async()=>{await insert('alerts',{[kind==='job'?'job_id':'work_id']:id,author_id:user.id,kind:kindAlert,body:note,resolved:false});await insert('notes',{[kind==='job'?'job_id':'work_id']:id,author_id:user.id,body:note})})}
async function resolveAlert(id){if(!admin())return;await run(()=>update('alerts',id,{resolved:true}))}
async function loadGallery(kind,id){let el=$('gallery-'+kind+'-'+id);if(!el)return;let ps=photos.filter(p=>p[kind==='job'?'job_id':'work_id']===id);el.innerHTML='';for(let p of ps){let {data,error}=await sb.storage.from('fotos-trabajos').createSignedUrl(p.storage_path,300);if(error){let msg=document.createElement('p');msg.textContent='No se pudo cargar una fotografía: '+error.message;el.append(msg);continue}let a=document.createElement('a');a.href=data.signedUrl;a.target='_blank';a.rel='noopener noreferrer';let img=document.createElement('img');img.src=data.signedUrl;img.alt='Fotografía del trabajo';a.append(img);el.append(a)}}
async function upload(kind,id,input,date=''){if(!tech())return;let files=Array.from(input.files||[]);if(!files.length)return;let day=kind==='work'?days.find(d=>d.work_id===id&&d.work_date===date&&dayAssigned(d)):null;if(kind==='work'&&!day)return say('No tienes asignada esta jornada de obra');let count=kind==='job'?photos.filter(p=>p.job_id===id).length:workDayPhotos(id,date).length;if(count+files.length>5)return say('Máximo cinco fotografías por '+(kind==='job'?'trabajo':'día de obra, entre todos los técnicos'));await run(async()=>{for(let file of files){let ext=file.name.split('.').pop().toLowerCase();if(!['jpg','jpeg','png','webp'].includes(ext)||!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Solo imágenes JPG, PNG o WEBP');let path=(kind==='job'?'jobs/'+id:'works/'+id+'/dias/'+date)+'/'+crypto.randomUUID()+'.'+ext;let {error}=await sb.storage.from('fotos-trabajos').upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;let {error:ins}=await sb.from('photos').insert({[kind==='job'?'job_id':'work_id']:id,uploaded_by:user.id,storage_path:path});if(ins){await sb.storage.from('fotos-trabajos').remove([path]);throw ins}}})}

if(!sb)say('No se ha podido cargar Supabase. Comprueba tu conexión a Internet.');else sb.auth.getSession().then(({data,error})=>{if(error)err(error);else if(data.session)start().catch(err)});
</script></html>
